# Scheduled runs act as the last user to modify the CRON LINE below (not just this
# file); keep that an active, verified account. Editing other lines does not change it.
name: send-daily-exercise

on:
  schedule:
    - cron: '36 21 * * 0-5'  # 6:36 AM KST (Monday to Saturday)
  workflow_dispatch:

jobs:
  send_message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r src/requirements.txt

      - name: Run Slack Message Script
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python src/main.py

